# GGTO 솔버 래퍼 (P4.md 1절). 레포 안의 유일한 비-TS 코드다.
#
# **왜 래퍼인가**: 상류 `postflop-solver` 에는 `Cargo.lock` 이 없고 (`.gitignore` 에 들어 있다),
# `bincode = "2.0.0-rc.3"` 의 caret 요구 구간이 stable 2.0.1 을 포함해 오늘의 crates.io 인덱스에서는
# 2.0.1 이 선택돼 `E0107` 로 깨진다 (스파이크 2.1). 우리 크레이트의 `Cargo.lock` 을 커밋하고
# 항상 `--locked` 로 빌드하면 그 해석이 고정된다.
#
# 라이선스: `postflop-solver` 가 AGPL-3.0-or-later 이고 이 바이너리는 그것과 링크되므로
# 이 크레이트도 AGPL-3.0-or-later 다. TS 쪽과는 **프로세스 경계**로 분리된다 (D2).

[package]
name = "ggto-solver-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "GGTO solver daemon: stdio JSON-lines RPC around postflop-solver"

[lib]
name = "ggto_solver_cli"
path = "src/lib.rs"

[[bin]]
name = "ggto-solver-cli"
path = "src/main.rs"

[dependencies]
# 커밋 고정. 기본 feature = bincode + rayon, zstd 는 끈다 (C 코드가 들어오는 유일한 경로였다).
postflop-solver = { git = "https://github.com/b-inary/postflop-solver.git", rev = "9d1509fe5077d019825f833eed04b16d342dfda1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# `clap`/`tokio` 는 금지다 (P4.md 1절): 둘 다 `windows-sys` 를 끌어오고, GNU 호스트의
# 번들 dlltool 이 import library 를 못 만든다 (스파이크 3절). 인자 파싱은 손으로 한다.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
