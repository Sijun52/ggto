  <g class="xs">
    <rect x="222" y="212" width="9" height="9" fill="#dc2626"/><text x="236" y="220">B15</text>
    <rect x="290" y="212" width="9" height="9" fill="#f59e0b"/><text x="304" y="220">B6.6</text>
    <rect x="358" y="212" width="9" height="9" fill="#3b82f6"/><text x="372" y="220">X</text>
  </g>

  <!-- runout heatmap -->
  <text class="ttl" x="222" y="252">런아웃 히트맵 · 턴 49장</text>
  <text class="cap" x="386" y="252">카드별 OOP EV 변화. 실제 학습에서 제일 도움 된다</text>
  <g class="xs mono">
    <rect x="222" y="262" width="30" height="22" fill="#059669"/><text x="237" y="277" text-anchor="middle" fill="#ffffff">A♠</text>
    <rect x="254" y="262" width="30" height="22" fill="#34d399"/><text x="269" y="277" text-anchor="middle" fill="#064e3b">A♦</text>
    <rect x="286" y="262" width="30" height="22" fill="#fca5a5"/><text x="301" y="277" text-anchor="middle" fill="#7f1d1d">A♥</text>
    <rect x="318" y="262" width="30" height="22" fill="#6ee7b7"/><text x="333" y="277" text-anchor="middle" fill="#064e3b">K♦</text>
    <rect x="350" y="262" width="30" height="22" fill="#fecaca"/><text x="365" y="277" text-anchor="middle" fill="#7f1d1d">Q♥</text>
    <rect x="382" y="262" width="30" height="22" fill="#a7f3d0"/><text x="397" y="277" text-anchor="middle" fill="#064e3b">9♠</text>
    <rect x="414" y="262" width="30" height="22" fill="#ef4444"/><text x="429" y="277" text-anchor="middle" fill="#ffffff">5♥</text>
    <rect x="446" y="262" width="34" height="22" fill="#e2e8f0"/><text x="463" y="277" text-anchor="middle" fill="#64748b">…</text>
  </g>
  <g class="xs">
    <text x="222" y="300">A♠ +2.14</text><text x="290" y="300">A♥ −0.42</text><text x="358" y="300">5♥ −1.86</text>
  </g>
  <text class="cap" x="222" y="322">하트가 떨어지면 OOP 가 손해 — 플러시 드로가 BTN 쪽에 더 많다</text>

  <line x1="500" y1="76" x2="500" y2="380" stroke="#e2e8f0"/>

  <!-- aggregate -->
  <text class="ttl" x="522" y="88">어그리게이트</text>
  <g>
    <rect x="522" y="100" width="318" height="22" rx="4" fill="#f8fafc"/>
    <rect x="522" y="100" width="184" height="22" rx="4" fill="#dbeafe"/>
    <text class="sm" x="532" y="115">X</text><text class="sm mono" x="830" y="115" text-anchor="end">58%</text>
    <rect x="522" y="128" width="318" height="22" rx="4" fill="#f8fafc"/>
    <rect x="522" y="128" width="99" height="22" rx="4" fill="#fef3c7"/>
    <text class="sm" x="532" y="143">B6.6</text><text class="sm mono" x="830" y="143" text-anchor="end">31%</text>
    <rect x="522" y="156" width="318" height="22" rx="4" fill="#f8fafc"/>
    <rect x="522" y="156" width="35" height="22" rx="4" fill="#fee2e2"/>
    <text class="sm" x="532" y="171">B15</text><text class="sm mono" x="830" y="171" text-anchor="end">11%</text>
  </g>
  <line x1="522" y1="192" x2="840" y2="192" stroke="#e2e8f0"/>
  <text class="sm" x="522" y="212">노드 EV OOP · IP (= 팟)</text><text class="lbl mono" x="830" y="212" text-anchor="end" fill="#059669">+12.84 · +7.16</text>
  <text class="sm" x="522" y="234">OOP 에퀴티</text><text class="lbl mono" x="830" y="234" text-anchor="end">54.1%</text>
  <text class="sm" x="522" y="256">IP 에퀴티</text><text class="lbl mono" x="830" y="256" text-anchor="end">45.9%</text>

  <g class="sm">
    <rect x="522" y="286" width="100" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="572" y="304" text-anchor="middle" fill="#475569">레인지 편집</text>
    <rect x="630" y="286" width="80" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="670" y="304" text-anchor="middle" fill="#475569">저장</text>
    <rect x="718" y="286" width="122" height="28" rx="5" fill="#0f172a"/><text x="779" y="304" text-anchor="middle" fill="#ffffff">트레이너로 보내기</text>
  </g>
  <text class="cap" x="522" y="336">뷰어가 곧 트레이너의 해설 화면이다 — 같은 컴포넌트를 마스킹만 벗겨 쓴다</text>

  <text class="cap" x="20" y="418">P5 포스트플랍 탐색기 · 데스크톱 (≥ 1280) 3열. 값은 예시. line 은 D3 문법 (B6.6-C/Qc), 모바일 한 열은 p5-postflop-mobile.svg (R2 갱신)</text>
  <text class="cap" x="20" y="436" fill="#cbd5e1">GGTO · docs/assets/postflop-explorer-ui.svg</text>
</svg>
