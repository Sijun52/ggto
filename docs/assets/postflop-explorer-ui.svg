    <g>
      <rect x="222" y="104" width="18" height="18" fill="#dc2626"/><rect x="242" y="104" width="18" height="18" fill="#dc2626"/>
      <rect x="262" y="104" width="18" height="12" fill="#dc2626"/><rect x="262" y="116" width="18" height="6" fill="#f59e0b"/>
      <rect x="282" y="104" width="18" height="8" fill="#dc2626"/><rect x="282" y="112" width="18" height="10" fill="#f59e0b"/>
      <rect x="302" y="104" width="18" height="5" fill="#f59e0b"/><rect x="302" y="109" width="18" height="13" fill="#3b82f6"/>
      <rect x="322" y="104" width="18" height="18" fill="#3b82f6"/><rect x="342" y="104" width="18" height="18" fill="#3b82f6"/>
      <rect x="362" y="104" width="18" height="18" fill="#3b82f6"/><rect x="382" y="104" width="18" height="18" fill="#3b82f6"/>
      <rect x="402" y="104" width="18" height="18" fill="#3b82f6"/><rect x="422" y="104" width="18" height="18" fill="#3b82f6"/>
      <rect x="442" y="104" width="18" height="18" fill="#3b82f6"/><rect x="462" y="104" width="18" height="18" fill="#3b82f6"/>
    </g>
    <g>
      <rect x="222" y="124" width="18" height="18" fill="#dc2626"/><rect x="242" y="124" width="18" height="14" fill="#dc2626"/><rect x="242" y="138" width="18" height="4" fill="#f59e0b"/>
      <rect x="262" y="124" width="18" height="18" fill="#dc2626"/><rect x="282" y="124" width="18" height="9" fill="#f59e0b"/><rect x="282" y="133" width="18" height="9" fill="#3b82f6"/>
      <rect x="302" y="124" width="18" height="18" fill="#3b82f6"/><rect x="322" y="124" width="18" height="18" fill="#3b82f6"/>
      <rect x="342" y="124" width="18" height="18" fill="#3b82f6"/><rect x="362" y="124" width="18" height="18" fill="#3b82f6"/>
      <rect x="382" y="124" width="18" height="18" fill="#3b82f6"/><rect x="402" y="124" width="18" height="18" fill="#3b82f6"/>
      <rect x="422" y="124" width="18" height="18" fill="#3b82f6"/><rect x="442" y="124" width="18" height="18" fill="#3b82f6"/><rect x="462" y="124" width="18" height="18" fill="#3b82f6"/>
    </g>
    <g opacity=".75">
      <rect x="222" y="144" width="258" height="18" fill="#60a5fa"/>
      <rect x="222" y="164" width="258" height="18" fill="#93c5fd"/>
      <rect x="222" y="184" width="258" height="18" fill="#bfdbfe"/>
    </g>
