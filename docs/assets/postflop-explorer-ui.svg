    <rect x="392" y="76" width="42" height="20" rx="4" fill="#0f172a"/><text x="413" y="90" text-anchor="middle" fill="#ffffff">OOP</text>
    <rect x="438" y="76" width="34" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="455" y="90" text-anchor="middle">IP</text>
