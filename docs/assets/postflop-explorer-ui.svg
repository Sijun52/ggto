<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Roboto, Arial, sans-serif">
  <defs><style>
    .ttl{font-size:13px;fill:#0f172a;font-weight:600}.lbl{font-size:12px;fill:#0f172a}
    .sm{font-size:11.5px;fill:#475569}.xs{font-size:10.5px;fill:#64748b}
    .cap{font-size:10.5px;fill:#94a3b8}
    .mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace}
  </style></defs>
  <rect width="880" height="450" fill="#f8fafc"/>
  <rect x="20" y="20" width="840" height="374" rx="10" fill="#ffffff" stroke="#cbd5e1"/>

  <!-- header -->
  <rect x="20" y="20" width="840" height="44" rx="10" fill="#f8fafc"/>
  <rect x="20" y="50" width="840" height="14" fill="#f8fafc"/>
  <line x1="20" y1="64" x2="860" y2="64" stroke="#e2e8f0"/>
  <text class="lbl" x="38" y="48">OOP: BB vs BTN 3bet-call</text>
  <text class="sm" x="228" y="48">Board</text>
  <g>
    <rect x="270" y="32" width="26" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text class="lbl" x="283" y="49" text-anchor="middle">K♠</text>
    <rect x="300" y="32" width="26" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text class="lbl" x="313" y="49" text-anchor="middle" fill="#dc2626">7♥</text>
    <rect x="330" y="32" width="26" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text class="lbl" x="343" y="49" text-anchor="middle" fill="#dc2626">2♥</text>
  </g>
  <text class="sm mono" x="380" y="48">Pot 21.5</text>
  <text class="sm mono" x="452" y="48">Eff 89.2</text>
  <text class="xs mono" x="520" y="48" fill="#475569">line B6.6-C/Qc</text>
  <rect x="640" y="35" width="66" height="18" rx="9" fill="#e2e8f0"/><text class="xs" x="673" y="48" text-anchor="middle">정규 표기</text>
  <text class="xs mono" x="716" y="48" fill="#94a3b8">expl 0.21% · perm [0,1,2,3]</text>

  <!-- action tree -->
  <text class="ttl" x="38" y="88">액션 트리</text>
  <g class="sm">
    <text x="38" y="110">▾ Flop</text>
    <text x="52" y="130">▸ X</text>
    <rect x="44" y="138" width="140" height="18" rx="4" fill="#eff6ff"/>
    <text x="52" y="151" fill="#1d4ed8">▾ B6.6</text><circle cx="128" cy="146" r="3.5" fill="#1d4ed8"/>
    <text x="66" y="171">▸ F</text>
    <rect x="58" y="179" width="126" height="18" rx="4" fill="#eff6ff"/>
    <text x="66" y="192" fill="#1d4ed8">▾ C</text><circle cx="128" cy="187" r="3.5" fill="#1d4ed8"/>
    <text x="80" y="212">▾ Qc (Turn)</text>
    <text x="94" y="232" fill="#94a3b8">…</text>
  </g>
  <text class="cap" x="38" y="262">브레드크럼 + 클릭 이동</text>
  <text class="cap" x="38" y="278">노드 이동마다 1 요청 · ChanceNode → runouts</text>
  <line x1="200" y1="76" x2="200" y2="380" stroke="#e2e8f0"/>

  <!-- grid -->
  <text class="ttl" x="222" y="88">OOP 전략 · 169 격자</text>
