  <!-- ===== Right: contract & rules ===== -->
  <g transform="translate(560,36)">
    <text class="ttl" x="0" y="0">1절 계약 — 프론트가 지키는 것</text>
    <g class="sm">
      <text x="0" y="22">정규 모드: 쿼리 전무 → perm [0,1,2,3] → 칩 "정규 표기"</text>
      <text x="0" y="40">표기 모드: board·oop·ip·potBb·stackBb 전부 → 400 HashMismatch 면 폴백</text>
      <text x="0" y="58">line: <tspan class="mono">B6.6-C/Qc/X-B15</tspan> — 액션 '-', 스트리트·카드 '/'</text>
      <text x="0" y="76">노드 종류는 서버 코드로만: ChanceNode → runouts, NoSuchLine → 종료</text>
      <text x="0" y="94">board 는 응답 그대로 (요청 표기 + 딜된 카드). 클라이언트가 붙이지 않는다</text>
      <text x="0" y="112">base64 → Float32Array (f32, D7). 169 는 브라우저 집계 (D14), aggregate 는 대조용</text>
      <text x="0" y="130">표기는 localStorage['ggto.solve.notation.&lt;hash&gt;'] — URL 은 hash+line 뿐</text>
    </g>
    <line x1="0" y1="146" x2="320" y2="146" stroke="#e2e8f0"/>
    <text class="ttl" x="0" y="168">배치 (한 컴포넌트, CSS 만 다름)</text>
    <g class="sm">
      <text x="0" y="190">&lt; 768  한 열: 헤더 → 라인 바 → 토글 → 격자|히트맵 → 어그리게이트 → 하단 바</text>
      <text x="0" y="208">768~1279  2열: 격자 ≤ 420 + 우측 열 ≥ 280 (토글·어그리게이트·액션)</text>
      <text x="0" y="226">≥ 1280  3열: 트리 200 · 격자 520 + 런아웃 · w-96 어그리게이트</text>
    </g>
    <line x1="0" y1="242" x2="320" y2="242" stroke="#e2e8f0"/>
    <text class="ttl" x="0" y="264">모바일 규칙 (P3M 계승)</text>
    <g class="sm">
      <text x="0" y="286">innerWidth === scrollWidth === 375 · 격자 325 · 타겟 ≥ 44 (격자·히트맵 칸 예외)</text>
      <text x="0" y="304">하단 바 sticky + safe-area, 액션 버튼 48px = 트레이너 답 버튼 자리 (P6 가 마스킹)</text>
      <text x="0" y="322">호버 없음 → "선택:" 상태줄 · 스와이프 없음 · touch-action: manipulation</text>
    </g>
    <line x1="0" y1="338" x2="320" y2="338" stroke="#e2e8f0"/>
    <text class="ttl" x="0" y="360">오류 → 화면</text>
    <g class="sm">
      <text x="0" y="382">503 SolverUnavailable → 배너, 폼 비활성 (가짜 솔버 금지, D24)</text>
      <text x="0" y="400">413 TooLarge → 폼 오류 "사이징을 줄이세요"</text>
      <text x="0" y="418">HashMismatch → 저장 표기 삭제 + 정규 모드 + 토스트</text>
      <text x="0" y="436">NoSuchLine → line='' · NoSolve → 목록 · evAvgBb null → "—"</text>
    </g>
  </g>

  <text class="cap" x="40" y="530">P5 포스트플랍 탐색기 · 모바일 375px 한 열 (0.58× 축소). 값은 예시. 데스크톱 3열은 postflop-explorer-ui.svg</text>
