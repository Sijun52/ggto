<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Roboto, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
    <style>
      .ttl{font-size:13px;fill:#0f172a;font-weight:600}.lbl{font-size:12px;fill:#0f172a}
      .sm{font-size:11.5px;fill:#475569}.xs{font-size:10.5px;fill:#64748b}.cap{font-size:10.5px;fill:#94a3b8}
      .mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace}
    </style>
  </defs>
  <rect width="860" height="420" fill="#f8fafc"/>
  <text class="ttl" x="20" y="30">P4 프로세스 토폴로지 — Node 는 조율, Rust 는 연산 (AGPL 경계 = 프로세스)</text>

  <!-- web -->
  <rect x="20" y="56" width="150" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="lbl" x="34" y="80">web (P5)</text>
  <text class="xs" x="34" y="98">POST /api/solve</text>
  <text class="xs" x="34" y="114">SSE · node?line=</text>

  <!-- server -->
  <rect x="210" y="46" width="230" height="330" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="lbl" x="224" y="70">@ggto/server</text>
  <text class="xs" x="224" y="86">routes/solve.ts — HTTP·SSE 만</text>
  <rect x="224" y="100" width="202" height="262" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="lbl" x="238" y="122">@ggto/solver</text>
  <text class="xs mono" x="238" y="142">interface Solver</text>
  <text class="xs" x="238" y="160">· canonicalize(board, ranges) → hash</text>
  <text class="xs" x="238" y="176">· JobQueue: 동시 2 · Σ 예상 메모리 ≤ 8GB</text>
  <text class="xs" x="238" y="192">· SolveCache: data/solves/*.bin + index.db</text>
  <text class="xs" x="238" y="208">  LRU · 총량 ≤ 20GB</text>
  <text class="xs" x="238" y="224">· DaemonClient: JSON-lines over stdio</text>
  <text class="xs" x="238" y="240">  spawn / cancel(kill) / 타임아웃</text>
  <text class="xs" x="238" y="264">여기가 유일한 child_process 사용처</text>
  <text class="xs" x="238" y="280">web·core·preflop·trainer 는 데몬을 모른다</text>
  <text class="xs mono" x="238" y="304">FakeSolver (TS) · fake-daemon.mjs</text>
  <text class="xs" x="238" y="320">테스트 대역 — Rust 없이 ci 통과</text>
  <text class="xs mono" x="238" y="344">GGTO_SOLVER_BIN 없음 → 503</text>

  <line x1="170" y1="90" x2="210" y2="90" stroke="#475569" stroke-width="1.4" marker-end="url(#a1)"/>

  <!-- solver processes -->
  <rect x="490" y="46" width="350" height="150" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text class="lbl" x="504" y="70">ggto-solver-cli --solve (잡당 프로세스 1, 최대 2)</text>
  <text class="xs mono" x="504" y="90">stdin:  {"id":1,"method":"solve","params":{config…}}</text>
  <text class="xs mono" x="504" y="106">stdout: {"method":"progress","params":{iter,expl,pct}} …</text>
  <text class="xs mono" x="504" y="122">        {"id":1,"result":{iterations,exploitabilityPct,elapsedMs,bytes}}</text>
  <text class="xs" x="504" y="144">완료 시 data/solves/{hash}.bin 저장 후 exit 0</text>
  <text class="xs" x="504" y="160">취소 = stdin close → 2s → kill. 메모리는 프로세스와 함께 사라진다</text>
  <text class="xs" x="504" y="180" fill="#991b1b">postflop-solver 9d1509fe · bincode rc.3 핀 Cargo.lock · --locked</text>

  <rect x="490" y="220" width="350" height="156" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text class="lbl" x="504" y="244">ggto-solver-cli --serve (조회 데몬 1, 상주)</text>
  <text class="xs mono" x="504" y="264">load {hash,path} → 결과를 메모리에 (LRU, 합 ≤ 2GB)</text>
  <text class="xs mono" x="504" y="280">node {hash,line} → strategy/ev f32[actions][1326] (base64)</text>
  <text class="xs mono" x="504" y="296">runouts {hash,line} → 49장 × {ev, equity, strategy 집계}</text>
  <text class="xs" x="504" y="318">line 은 core 의 액션 시퀀스 문자열 (B6.6-C/Qc — 구분자 - 와 /, D3) — 정규형만</text>
  <text class="xs" x="504" y="334">1326 배열은 정규 보드 기준. Node 가 SuitMap 역순열로 원본 슈트로 되돌린다 (D5·D6)</text>
  <text class="xs" x="504" y="356">죽으면 클라이언트가 재기동 · 로드 상태는 idempotent 재로드</text>

  <line x1="440" y1="120" x2="490" y2="120" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#a2)" marker-start="url(#a2)"/>
  <line x1="440" y1="290" x2="490" y2="290" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#a2)" marker-start="url(#a2)"/>
  <text class="xs" x="443" y="112" fill="#991b1b">stdio</text>
  <text class="xs" x="443" y="282" fill="#991b1b">stdio</text>

  <text class="cap" x="20" y="404" fill="#cbd5e1">GGTO · docs/assets/p4-solver-topology.svg · 파이프라인 단계는 solve-pipeline.svg</text>
</svg>
