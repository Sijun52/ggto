  <text class="cap" x="20" y="396">P2 프리플랍 차트 뷰어 · 데스크톱 레이아웃. 모바일 대응은 docs/specs/P3M.md</text>
  <text class="cap" x="20" y="414" fill="#cbd5e1">GGTO · docs/assets/chart-viewer-ui.svg</text>
