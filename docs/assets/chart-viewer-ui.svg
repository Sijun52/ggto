    <text x="376" y="274">A♥J♥   R 62%  C 31%  F 7%</text>
    <text x="376" y="292">A♦J♦   R 61%  C 32%  F 7%</text>
    <text x="376" y="310">A♣J♣   R 61%  C 32%  F 7%</text>
