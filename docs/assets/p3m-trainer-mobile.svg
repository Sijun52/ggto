<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Roboto, Arial, sans-serif">
  <style>
    .t   { font-size: 12px; fill: #0f172a; }
    .s   { font-size: 10.5px; fill: #475569; }
    .h   { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .w   { font-size: 11px; fill: #f8fafc; font-weight: 700; }
    .frame { fill: #020617; stroke: #334155; stroke-width: 2; }
    .zone  { fill: #0f172a; stroke: #475569; stroke-width: 1; }
    .note  { font-size: 11px; fill: #334155; }
    .arrow { stroke: #64748b; stroke-width: 1.2; fill: none; marker-end: url(#ar); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="24" class="h">P3M 트레이너 모바일 레이아웃 (375×812, 세로 스택 + 하단 고정 액션 바)</text>

  <!-- phone A: asking -->
  <text x="60" y="52" class="t">① 출제 (asking)</text>
  <rect x="60" y="60" width="240" height="470" rx="18" class="frame"/>
  <rect x="72" y="72" width="216" height="30" rx="4" class="zone"/>
  <text x="80" y="91" class="w">Trainer  스팟 7/20   [리포트]</text>
  <rect x="72" y="108" width="216" height="34" rx="4" class="zone"/>
  <text x="80" y="122" class="w">HU 10bb · SB · root · open</text>
  <text x="80" y="136" class="w">히어로: A♠ 7♦   (카드 40px)</text>
  <rect x="72" y="148" width="216" height="216" rx="4" fill="#1e293b" stroke="#475569"/>
  <g stroke="#0f172a" stroke-width="1">
    <path d="M72 148 h216 M72 165 h216 M72 182 h216 M72 199 h216 M72 216 h216 M72 233 h216 M72 250 h216 M72 267 h216 M72 284 h216 M72 301 h216 M72 318 h216 M72 335 h216 M72 352 h216"/>
    <path d="M72 148 v216 M89 148 v216 M106 148 v216 M123 148 v216 M140 148 v216 M157 148 v216 M174 148 v216 M191 148 v216 M208 148 v216 M225 148 v216 M242 148 v216 M259 148 v216 M276 148 v216"/>
  </g>
  <rect x="174" y="250" width="17" height="17" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <text x="80" y="380" class="w" font-weight="400">선택: A7o (호버 대신 탭 = 선택)</text>
  <rect x="72" y="390" width="216" height="60" rx="4" fill="#020617" stroke="#1e293b" stroke-dasharray="3 3"/>
  <text x="80" y="414" class="s" fill="#94a3b8">(답 전에는 비어 있음 — 격자 아래 여백)</text>
  <!-- bottom bar -->
  <rect x="72" y="458" width="216" height="62" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="80" y="466" width="100" height="46" rx="8" fill="#94a3b8"/>
  <text x="118" y="494" class="t" font-weight="700">F</text>
  <rect x="188" y="466" width="92" height="46" rx="8" fill="#ef4444"/>
  <text x="226" y="494" class="t" font-weight="700">A</text>

  <!-- phone B: revealed -->
  <text x="360" y="52" class="t">② 답 후 (revealed) — 같은 화면, 마스크만 벗김</text>
  <rect x="360" y="60" width="240" height="470" rx="18" class="frame"/>
  <rect x="372" y="72" width="216" height="30" rx="4" class="zone"/>
  <text x="380" y="91" class="w">Trainer  스팟 7/20   [리포트]</text>
  <rect x="372" y="108" width="216" height="34" rx="4" class="zone"/>
  <text x="380" y="122" class="w">HU 10bb · SB · root · open</text>
  <text x="380" y="136" class="w">히어로: A♠ 7♦   범례 ● F ● A</text>
  <rect x="372" y="148" width="216" height="216" rx="4" fill="#ef4444" stroke="#475569"/>
  <path d="M372 260 L588 260 L588 364 L372 364 Z" fill="#64748b"/>
  <g stroke="#0f172a" stroke-width="1">
    <path d="M372 165 h216 M372 182 h216 M372 199 h216 M372 216 h216 M372 233 h216 M372 250 h216 M372 267 h216 M372 284 h216 M372 301 h216 M372 318 h216 M372 335 h216 M372 352 h216"/>
    <path d="M389 148 v216 M406 148 v216 M423 148 v216 M440 148 v216 M457 148 v216 M474 148 v216 M491 148 v216 M508 148 v216 M525 148 v216 M542 148 v216 M559 148 v216 M576 148 v216"/>
  </g>
  <rect x="474" y="250" width="17" height="17" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <rect x="372" y="372" width="216" height="78" rx="4" class="zone"/>
  <text x="380" y="388" class="w">F   0%   0.00bb</text>
  <text x="380" y="403" class="w">A ← 100%  +1.42bb</text>
  <text x="380" y="420" class="w" font-weight="400">▸ 콤보 12개 보기 (접힘, 탭으로 펼침)</text>
  <text x="380" y="440" class="s" fill="#94a3b8">스크롤 없이 verdict 가 보여야 한다</text>
  <rect x="372" y="458" width="216" height="62" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="380" y="466" width="70" height="22" rx="4" fill="#059669"/>
  <text x="388" y="481" class="w">Perfect</text>
  <text x="456" y="481" class="w" font-weight="400">EV loss 0.00bb</text>
  <rect x="380" y="492" width="200" height="22" rx="6" fill="#0284c7"/>
  <text x="458" y="507" class="w">다음 →  (전폭, 높이 ≥ 44)</text>

  <!-- annotations -->
  <text x="640" y="80" class="h">규칙</text>
  <text x="640" y="104" class="note">1. 한 열 스택: 헤더 → 스팟 → 격자 → (답 후) 액션표 → 하단 바</text>
  <text x="640" y="124" class="note">2. 격자 한 변 = min(520, 뷰포트 폭 − 패딩 − 축 라벨). 375 → 327px</text>
  <text x="640" y="144" class="note">3. 하단 바는 position: sticky; bottom: 0 + safe-area-inset-bottom</text>
  <text x="640" y="164" class="note">4. 답 버튼: 높이 ≥ 44, 바를 균등 분할, 엄지 도달 범위(하단 1/4)</text>
  <text x="640" y="184" class="note">5. 답 후 바에 verdict 칩 + EV loss + 전폭 "다음"</text>
  <text x="640" y="204" class="note">6. 콤보 패널은 접힘(기본). 데스크톱도 동일 (1280 회귀 수정)</text>
  <text x="640" y="224" class="note">7. 호버 없음: 탭 = 선택, 상태줄은 선택 셀 요약</text>
  <text x="640" y="244" class="note">8. 스와이프 제스처 없음 (오답 유발 · 브라우저 뒤로가기 충돌)</text>
  <text x="640" y="264" class="note">9. layout viewport 확장 금지: innerWidth === 375 가 게이트</text>
  <path d="M600 489 L636 489" class="arrow"/>
  <text x="640" y="493" class="note">바 높이 62 = 8 + 46 + 8 (버튼 46)</text>
  <path d="M300 258 L340 258" class="arrow"/>
  <text x="308" y="250" class="s">탭 = 선택</text>
</svg>
